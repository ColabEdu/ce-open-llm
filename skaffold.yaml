apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: colabedu-inference
build:
  artifacts:
    - image: llm-server
      docker:
        dockerfile: Dockerfile
profiles:
  # --- CLOUD PROFILE (NVIDIA L4 - 24GB) ---
  - name: cloud-open-llm
    manifests:
      rawYaml: ["k8s/service-cloud.yaml"]
    deploy:
      cloudrun:
        projectid: prevvy1
        region: us-central1

  # --- LOCAL PROFILE (RTX 3090 - 24GB) ---
  - name: local-open-llm
    build:
      local:
        push: false
    manifests:
      rawYaml: ["k8s/service-local.yaml"]