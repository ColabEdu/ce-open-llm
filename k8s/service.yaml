apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: colabedu-inference-server
  annotations:
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 4
      timeoutSeconds: 600
      containers:
        - image: llm-server
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "32Gi"
          env:
            - name: MODEL_NAME
              value: "BSC-LT/salamandra-7b-instruct"
          ports:
            - containerPort: 8080